<script>
  // Simple interaction script to add a ripple effect to list items and buttons
  document.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', function(e) {
      const x = e.clientX - e.target.getBoundingClientRect().left;
      const y = e.clientY - e.target.getBoundingClientRect().top;
      
      const ripple = document.createElement('span');
      ripple.classList.add('absolute', 'bg-black/5', 'rounded-full', 'scale-0', 'animate-[ping_0.5s_cubic-bezier(0,0,0.2,1)]', 'pointer-events-none');
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = '100px';
      ripple.style.height = '100px';
      ripple.style.transform = 'translate(-50%, -50%)';
      
      if(this.classList.contains('relative') === false) {
        this.classList.add('relative', 'overflow-hidden');
      }
      
      this.appendChild(ripple);
      
      setTimeout(() => {
        ripple.remove();
      }, 500);
    });
  });
