</div>
<form class="space-y-5" id="loginForm">

<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
    }
</style>
<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const visibilityIcon = document.getElementById('visibilityIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            visibilityIcon.textContent = 'visibility';
            visibilityIcon.classList.add('text-secondary');
        } else {
            passwordInput.type = 'password';
            visibilityIcon.textContent = 'visibility_off';
            visibilityIcon.classList.remove('text-secondary');
        }
    }

    // Add subtle form submit interaction
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = this.querySelector('button[type="submit"]');
        const originalText = btn.innerHTML;
        
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span class="ml-2">กำลังเข้าสู่ระบบ...</span>';
        btn.style.opacity = '0.9';
        
        // Simulate network request
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.opacity = '1';
        }, 1500);
    });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-safe" data-active-classes="text-secondary"><div class="flex items-center justify-around h-16 px-4"><a class="flex flex-col items-center justify-center w-full text-on-surface-variant" data-path="dashboard"><span class="material-symbols-outlined">dashboard</span><span class="text-label-sm mt-1">หน้าหลัก</span></a><a class="flex flex-col items-center justify-center w-full text-on-surface-variant" data-path="courses"><span class="material-symbols-outlined">school</span><span class="text-label-sm mt-1">คอร์ส</span></a><a aria-current="page" class="flex flex-col items-center justify-center w-full text-secondary" data-path="settings"><span class="material-symbols-outlined">settings</span><span class="text-label-sm mt-1">ตั้งค่า</span></a></div></nav></body></html>
