<!-- Background Design Elements -->
<div class="absolute top-0 right-0 -mr-16 -mt-8 w-64 h-64 rounded-full bg-secondary-fixed opacity-30 blur-3xl pointer-events-none"></div>
<div class="absolute bottom-0 left-0 -ml-16 w-80 h-80 rounded-full bg-tertiary-fixed-dim opacity-20 blur-3xl pointer-events-none"></div>
<div class="flex flex-col px-margin-mobile pt-6 pb-margin-mobile relative z-10 space-y-6">
<!-- Header Section -->
<div class="flex items-center">
<button aria-label="Go back" class="flex items-center text-on-surface-variant bg-surface-container-low rounded-full px-4 py-2 shadow-sm transition-transform active:scale-95">
<span class="material-symbols-outlined text-label-md mr-1">arrow_back</span>
<span class="text-label-md">ย้อนกลับ</span>
</button>
</div>
<div class="flex flex-col space-y-4">
<img alt="SkillUp Logo" class="w-16 h-16 rounded-xl shadow-sm object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLvV1rvEGInMeAzs8uNm3iGJzBjv6sSRNYZdjTQXynm9yhUlczdvaJCMeSjkyITvZ7jUs6LF1pNlD-ETg81uJgNSkz2yDdK4S5iy8jOdqK4LVdkvLBiqL2Ajz7ORN4HNHsb8aOuSfpJvESFjOBX7qHlH9H6ehB4hcJtMIh_vehRDkWzbCsqffPpvHZVVK_Z4RouwN6P--aT0qoW2A0QLRaMMOtwSp-3o998dw4dumrazWXAJjYULc7ynmFA"/>
<div>
<h2 class="text-headline-lg-mobile text-on-surface mb-2">เริ่มต้นเส้นทางการเรียนรู้และอาชีพใหม่</h2>
<p class="text-body-md text-on-surface-variant">สร้างบัญชีฟรีเพื่อเข้าถึงคอร์สเรียนและตำแหน่งงานชั้นนำ</p>
</div>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-md p-6 flex flex-col space-y-5">
<!-- Input Fields -->
<div class="flex flex-col space-y-4">
<div class="flex flex-col space-y-1">
<label class="text-label-sm text-on-surface-variant ml-1" for="fullName">ชื่อ-นามสกุล</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">person</span>
<input class="w-full bg-surface text-body-md text-on-surface rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-secondary transition-shadow placeholder:text-outline-variant shadow-sm inset-shadow-sm" id="fullName" placeholder="ป้อนชื่อและนามสกุลของคุณ" type="text"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="text-label-sm text-on-surface-variant ml-1" for="email">อีเมล</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">mail</span>
<input class="w-full bg-surface text-body-md text-on-surface rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-secondary transition-shadow placeholder:text-outline-variant shadow-sm inset-shadow-sm" id="email" placeholder="example@email.com" type="email"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="text-label-sm text-on-surface-variant ml-1" for="phone">เบอร์โทรศัพท์</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">phone</span>
<input class="w-full bg-surface text-body-md text-on-surface rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-secondary transition-shadow placeholder:text-outline-variant shadow-sm inset-shadow-sm" id="phone" placeholder="08X-XXX-XXXX" type="tel"/>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="text-label-sm text-on-surface-variant ml-1" for="password">รหัสผ่าน</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock</span>
<input class="w-full bg-surface text-body-md text-on-surface rounded-xl pl-10 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-secondary transition-shadow placeholder:text-outline-variant shadow-sm inset-shadow-sm" id="password" placeholder="อย่างน้อย 8 ตัวอักษร" type="password"/>
<button class="absolute right-3 text-on-surface-variant focus:outline-none" onclick="togglePassword('password', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col space-y-1">
<label class="text-label-sm text-on-surface-variant ml-1" for="confirmPassword">ยืนยันรหัสผ่าน</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock_reset</span>
<input class="w-full bg-surface text-body-md text-on-surface rounded-xl pl-10 pr-10 py-3 focus:outline-none focus:ring-2 focus:ring-secondary transition-shadow placeholder:text-outline-variant shadow-sm inset-shadow-sm" id="confirmPassword" placeholder="ยืนยันรหัสผ่านอีกครั้ง" type="password"/>
<button class="absolute right-3 text-on-surface-variant focus:outline-none" onclick="togglePassword('confirmPassword', this)" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Terms Checkbox -->
<label class="flex items-start space-x-3 cursor-pointer group mt-2">
<div class="relative flex items-center justify-center pt-1">
<input class="peer appearance-none w-5 h-5 rounded-[4px] bg-surface ring-1 ring-outline-variant checked:bg-tertiary-fixed-dim checked:ring-0 transition-all cursor-pointer" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-tertiary-fixed text-[16px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="text-label-md text-on-surface-variant leading-tight">
                    ฉันยอมรับ<a class="text-secondary font-semibold hover:underline" href="#">เงื่อนไขการใช้งาน</a> และ<a class="text-secondary font-semibold hover:underline" href="#">นโยบายความเป็นส่วนตัว</a>
</span>
</label>
<!-- Submit Button -->
<button class="w-full bg-[#00C076] hover:bg-[#00A666] active:bg-[#008C56] text-white rounded-xl py-4 text-label-md font-bold shadow-md hover:shadow-lg transition-all flex justify-center items-center space-x-2 mt-4" id="submitBtn">
<span>สร้างบัญชีและเริ่มต้นใช้งาน</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<!-- Footer -->
<div class="flex justify-center mt-4">
<p class="text-body-md text-on-surface-variant">
                มีบัญชีอยู่แล้ว? 
                <a class="text-secondary font-semibold ml-1 hover:underline active:opacity-80" href="#">เข้าสู่ระบบ</a>
</p>
</div>
</div>
</div>
<script>
    function togglePassword(inputId, btnElement) {
        const input = document.getElementById(inputId);
        const icon = btnElement.querySelector('.material-symbols-outlined');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
            icon.style.color = 'var(--secondary)';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
            icon.style.color = '';
        }
    }

    // Optional: Add simple form validation animation
    document.getElementById('submitBtn').addEventListener('click', function(e) {
        e.preventDefault();
        const inputs = document.querySelectorAll('input');
        let isValid = true;
        
        inputs.forEach(input => {
            if(!input.value && input.type !== 'checkbox') {
                isValid = false;
                input.classList.add('ring-2', 'ring-error');
                setTimeout(() => input.classList.remove('ring-2', 'ring-error'), 1000);
            }
        });

        if(isValid) {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>กำลังสร้างบัญชี...</span>';
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>สร้างบัญชีสำเร็จ</span>';
                this.classList.replace('bg-[#00C076]', 'bg-tertiary-fixed');
                this.classList.replace('text-white', 'text-on-tertiary-fixed');
            }, 1500);
        }
    });
</script></main><nav class="fixed bottom-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_-2px_10px_rgba(0,0,0,0.05)] pb-safe" data-active-classes="text-secondary"><div class="flex items-center justify-around h-16 px-4"><a class="flex flex-col items-center justify-center w-full text-on-surface-variant" data-path="dashboard"><span class="material-symbols-outlined">dashboard</span><span class="text-label-sm mt-1">หน้าหลัก</span></a><a class="flex flex-col items-center justify-center w-full text-on-surface-variant" data-path="courses"><span class="material-symbols-outlined">school</span><span class="text-label-sm mt-1">คอร์ส</span></a><a aria-current="page" class="flex flex-col items-center justify-center w-full text-secondary" data-path="settings"><span class="material-symbols-outlined">settings</span><span class="text-label-sm mt-1">ตั้งค่า</span></a></div></nav></body></html>
